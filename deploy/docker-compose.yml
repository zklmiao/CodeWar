# CodeWar 三服务栈（ADR-0001）：app(Go) + judge(Python) + postgres
# 用途：本地/演示环境一键拉起。本地日常开发用 vite dev + go run + python -m judgesvc.server。
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    ports:
      - "3001:3001"
    environment:
      ADDR: ":3001"
      JUDGE_ADDR: "judge:50051"
      STATIC_DIR: "/srv/dist"
      # 07 号票：账号与战绩存储（app 启动时自动执行内嵌迁移；为空则退化为匿名热座）
      DATABASE_URL: "postgres://codewar:codewar-dev@postgres:5432/codewar?sslmode=disable"
    depends_on:
      - judge
      - postgres

  judge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.judge
    ports:
      - "50051:50051"
    environment:
      JUDGE_PORT: "50051"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codewar
      POSTGRES_PASSWORD: codewar-dev
      POSTGRES_DB: codewar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 迁移权威源只读挂载（供排查对照；app 实际执行的是内嵌进二进制的副本）
      - ../db/migrations:/migrations:ro

volumes:
  pgdata:
