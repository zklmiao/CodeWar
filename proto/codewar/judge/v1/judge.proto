syntax = "proto3";

package codewar.judge.v1;

option go_package = "codewar/server/gen/judgepb;judgepb";

// JudgeService：判题契约（纯函数 seam，spec「实现决策」）。
// 02 号票：一次性容器沙箱（ADR-0003）+ 每用例超时 + 容器级断网/配额隔离。
service JudgeService {
  rpc Judge(JudgeRequest) returns (JudgeVerdict);
}

message JudgeRequest {
  // 玩家提交的完整代码（本票只支持"补全函数"形式，代码即完整函数定义）
  string code = 1;
  // 该题全部隐藏测试；全部通过才判 passed
  repeated TestCase test_cases = 2;
  // 每用例执行超时（毫秒）：harness 逐用例施加，首败即停；整体另有墙钟上限
  //（用例数×每用例超时 + 30s）。<=0 时 judge 用服务端常量（默认 3000ms）。
  int32 timeout_ms = 3;
}

message TestCase {
  string name = 1;
  // Python 表达式：调用玩家函数，如 two_sum([2, 7, 11, 15], 9)
  string call = 2;
  // 期望结果的 Python repr，如 [0, 1]
  string expected = 3;
  // 15 号票（判题契约 v2）：可选的题作者 setup 代码——在 worker 内、玩家代码
  // import 之后、call 求值之前 exec 进玩家命名空间（可用沙箱构造辅助库：
  // list_to_nodes/build_tree/make_cycle 等），为 call 绑定结构体入参。
  // 空串 = 未声明，走现行 eval/repr 路径（完全向后兼容）。
  string setup = 4;
  // 可选的题作者比较器声明：`def _normalize(got): ...` 的完整函数源码，
  // 返回 got 的规范化 repr 字符串（链表→"[1,2,3]"、环→"cycle:[...]"、
  // 树→层序列表；环有界输出）。worker 只回传规范化串，值比对仍在宿主
  // （expected 永不进容器——零泄漏协议不变）。空串 = 用 repr(got)。
  // 题作者代码进容器属信任边界变化，见 docs/adr/0004。
  string compare = 5;
}

message JudgeVerdict {
  bool passed = 1;
  // ok | wrong-answer | runtime-error | syntax | timeout | limit-exceeded | judge-error
  // （limit-exceeded = 内存/pids 配额杀，与时钟杀 timeout 区分；02 号票新增）
  string category = 2;
  // 该次提交全部用例执行的总墙钟（容器内测量，反作弊遥测用；
  // 与玩家解题耗时是两个量，沙箱侧不换算只上报）
  int32 duration_ms = 3;
  // 仅 syntax 类别携带玩家自身代码的报错摘要（其类别不回传任何隐藏用例信息——设计 002 §3）
  string detail = 4;
}
