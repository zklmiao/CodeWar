syntax = "proto3";

package codewar.match.v1;

option go_package = "codewar/server/gen/matchpb;matchpb";

// ============ 对局同步契约（ADR-0002：事件流同步） ============
// 服务端权威：客户端只上行提交、下行应用事件。
// JSON 序列化走 protojson / ts-proto fromJson：int64 字段在 JSON 中是字符串，
// uint32/int32 是数字；事件类型判别靠 oneof 字段名。

// ============ 服务端 → 客户端 ============

enum MatchPhase {
  MATCH_PHASE_UNSPECIFIED = 0;
  MATCH_PHASE_WAITING = 1; // 等对手接入
  MATCH_PHASE_ROUND_ACTIVE = 2;
  MATCH_PHASE_ENDED = 3;
}

message ServerMessage {
  oneof payload {
    Snapshot snapshot = 1; // 接入/重连时先发快照，之后逐事件下发
    Envelope event = 2;
  }
}

message Snapshot {
  uint32 seq = 1; // 已应用到的最后事件序号
  MatchPhase phase = 2;
  repeated PlayerView players = 3;
  uint32 round = 4;
  // 当前回合截止时间（phase=ROUND_ACTIVE 时有效）；int64 → JSON 字符串
  int64 deadline_unix_ms = 5;
  reserved 6; // 03 号票前：单题 problem；03 起改用下方 panel（三题面板）
  // 查看者自己的提交锁截止（0 = 未锁定）；快照按连接下发，可含查看者私有视图
  int64 viewer_lock_until_unix_ms = 7;
  MatchResult result = 8; // phase=ENDED 时有效
  // 三题面板（03 号票）：attack 镜像 + 查看者私有 move/defend。
  // 快照按连接下发，私有题只带查看者自己的（与事件流的 PanelReady 不同——
  // 共享事件流必须对所有连接一致以保序号单调，故 PanelReady 同时携带双方私有面板）。
  Panel panel = 9;
  // 本场对局配置（05 号票，首个 join 锁定后整场不变；对局内只读展示——
  // 展示服务端锁定的权威值而非本窗口 URL 参数，两窗口参数冲突时不撒谎）。
  MatchConfig match_config = 10;
}

// 本场对局配置（05 号票）：题型过滤 + 难度上限档 + 抽题策略；
// 09 号票补充模式（PvP/PvE）与 Bot 难度（服务端锁定值，对局内展示用）。
message MatchConfig {
  // 题型过滤 key（syntax|string|array|hash|sort|recursion）；空 = 全部 6 题型
  string topic = 1;
  // 难度上限档 1..5（L1..L5，即出题区间 [L1, cap] 的上限，也是风险系数档位）
  uint32 cap = 2;
  // 抽题策略 uniform（均匀随机）| climb（对局爬坡）
  string strategy = 3;
  // 对局模式（09 号票）：空 = PvP（01~07 行为）；"pve" = 单人练习。
  string mode = 4;
  // Bot 难度（09 号票，仅 mode=pve 时非空）：easy | normal | hard。
  // 客户端据 PlayerView.bot + 本字段显示"机器人（难度）"。
  string bot = 5;
}

message PlayerView {
  string id = 1; // "p1" | "p2"
  int32 hp = 2;
  // 结算位置（5×5 网格，行列从 0 计；03 号票起动态站位）
  Position pos = 3;
  // 该玩家当前是否持有本回合护盾（重连快照渲染用）
  bool shielded = 4;
  // 职业（06 号票）：对局开始前不下发对方职业（盲选隐私，spec 设计 003 §1）；
  // 自己的一行始终携带。匿名/缺省对局为 "legacy"。
  string class_id = 5;
  // 已装备技能 ID（空 = 未装备技能位）
  string skill_id = 6;
  // 查看者自己的技能冷却剩余回合数（0 = 可用；仅查看者一行携带，对方行恒 0）
  int32 skill_cd_rounds = 7;
  // 该席位是否由模拟 Bot 控制（09 号票）：PvE 对局中 p2 行恒为 true；
  // PvP/匿名链路缺省 false（proto3 optional，旧客户端忽略未知字段）。
  optional bool bot = 8;
}

// 网格格子坐标（行列均从 0 计，5×5）
message Position {
  int32 row = 1;
  int32 col = 2;
}

message Problem {
  string id = 1;
  string statement = 2; // 题面（含示例说明）
  string signature = 3; // 函数签名行，如 def two_sum(nums, target):
  string starter_code = 4; // 编辑器初始内容
}

// 单名玩家的私有行动题（移动 + 防御；双方实例独立，seed 含 player 维度）
message PrivatePanel {
  Problem move = 1;
  Problem defend = 2;
  Problem skill = 3; // 06 号票：技能槽题（难度 = 所选上限档）
}

// 三题面板（03 号票）：攻击镜像 + 双方私有行动题。
// 共享事件流对所有连接内容一致（保序号单调）：私有题的双方面板都在其中，
// 客户端按 viewerId 取用——题面是公开文本（判题用例永不下发），无泄漏风险。
message PanelReady {
  Problem attack = 1; // 镜像题：双方同实例（spec 用户故事 12）
  PrivatePanel p1 = 2; // P1 私有行动题
  PrivatePanel p2 = 3; // P2 私有行动题
}

// 查看者视角的三题面板（Snapshot.panel 用；私有题已按查看者过滤）
message Panel {
  Problem attack = 1;
  Problem move = 2; // 查看者私有
  Problem defend = 3; // 查看者私有
  // 技能槽（06 号票）：查看者私有题，难度 = 所选上限档；未装备技能时缺省
  Problem skill = 4;
}

message MatchResult {
  // 胜者 "p1"/"p2"；空 = 平局
  string winner = 1;
  // ko（攻击致死）| self-ko（错误自损致死）| rounds-cap（回合上限按剩余 HP 判）
  string reason = 2;
}

// ============ 事件（对局事件流；spec「实现决策」） ============

message Envelope {
  uint32 seq = 1; // 单调递增，断号 → 客户端触发重连（ADR-0002）
  int64 unix_ms = 2; // 服务端时间戳（客户端校偏渲染倒计时）
  oneof event {
    RoundStarted round_started = 3;
    PanelReady panel_ready = 4;
    SubmissionJudged submission_judged = 5;
    ActionResolved action_resolved = 6;
    HpChanged hp_changed = 7;
    MatchEnded match_ended = 8;
    // 参数非法的提交被拒（03 号票：不判题不惩罚，玩家改参数可重交）
    SubmissionRejected submission_rejected = 9;
  }
}

message RoundStarted {
  uint32 round = 1; // 1 起
  int64 deadline_unix_ms = 2;
}

message SubmissionJudged {
  string player = 1;
  bool passed = 2;
  // ok | wrong-answer | locked | timeout | syntax | runtime-error | judge-error
  string category = 3;
  // 解题耗时（回合开始→通过），仅 passed=true 有意义；驱动时间系数
  int32 solve_ms = 4;
  // 该次失败是否施加了自损（locked/judge-error/syntax 不罚，见引擎规则）
  bool self_damage_applied = 5;
  // 提交者的锁定截止时间；仅本次判定触发锁定（自损路径）时携带，0 = 未触发锁定
  int64 lock_until_unix_ms = 6;
  // 本次提交对应的行动题（attack | move | defend；03 号票起携带）
  string action = 7;
}

message ActionResolved {
  string attacker = 1;
  // 行动类型：attack | move | defend（03 号票起）
  string action = 2;
  // 攻击/技能实际落地伤害 = 普攻（基础 × 时间系数）或技能字面值（设计 003 §4），
  // 命中且有盾时 ×0.4 折减取整；闪避或非攻击/技能行动为 0
  int32 damage = 3;
  // 治疗量（action=skill 且为治疗/汲取自疗时有效；溢出已截断，06 号票）
  int32 heal = 8;
  int32 solve_ms = 4;
  // 攻击未命中：目标不在攻击者相邻 4 格（结算时刻位置判定，走位闪避）
  bool dodged = 5;
  // 命中且目标本回合有护盾（damage 已按 ×0.4 折减）
  bool shielded = 6;
  // 移动终点（action=move 时有效）
  Position move_to = 7;
}

message HpChanged {
  string player = 1;
  int32 hp = 2; // 变更后
  int32 delta = 3; // 负值=受伤
  // attack | self-damage | heal | skill（06 号票起扩展）
  string cause = 4;
}

message MatchEnded {
  string winner = 1; // "p1"/"p2"；空 = 平局
  // ko | self-ko | rounds-cap
  string reason = 2;
  // 已结算对局的双方 ELO 变化（07 号票：结果落库后附在同一条 MatchEnded 上发出）。
  // 平局仍携带（elo_before == elo_after，delta=0），以便客户端区分"已结算平局（+0）"
  // 与"匿名未结算（字段为空）"；任一方匿名的对局该字段为空，终局面板不显示 ELO 区块。
  repeated PlayerElo elo = 3;
}

// 单名玩家在一次已结算对局中的 ELO 变化（MatchEnded.elo 的元素）。
message PlayerElo {
  string player = 1; // "p1" | "p2"
  string user_id = 2; // 用户 UUID（字符串形态）
  int32 elo_before = 3;
  int32 elo_after = 4;
}

// 参数非法的移动提交被拒（03 号票）：仅反馈原因，不判题不惩罚；
// 共享事件流携带（双方可见，无敏感信息），被拒方可改参数重交。
message SubmissionRejected {
  string player = 1;
  // out-of-bounds | diagonal | too-far | path-blocked | dest-occupied
  string reason = 2;
}

// ============ 客户端 → 服务端 ============

message ClientMessage {
  oneof payload {
    JoinRequest join = 1; // 首条消息必须 join
    SubmitRequest submit = 2;
    // 目标选择（06 号票）：解出攻击/技能题后、结算前可随时提交/修改（免费操作
    // 不耗答题，设计 003 §1）；未提交则结算时走自动瞄准。
    SetTargeting set_targeting = 3;
  }
}

message SetTargeting {
  Targeting targeting = 1;
}

message JoinRequest {
  string player = 1; // "p1" | "p2"
  // 可选认证令牌（07 号票）：注册/登录接口下发的服务端不透明会话令牌，
  // 客户端存 sessionStorage（按标签页隔离，支持同机双账号热座），WS 建连时明文携带（与页面同源）。
  // 为空 = 匿名热座，与 01 号票行为完全一致（向后兼容，不强制登录）；
  // 非空但无效/过期 = 建连被拒（客户端应重登后重试）。
  string token = 2;
  // 职业 + 已装备技能（06 号票，盲选）：各窗口本地选完再 join，天然互不可见；
  // 对局开始前快照不下发对方职业。缺省/未知值 = legacy 锚点（01~03 号票行为，
  // HP100/攻22/相邻1格/无技能——既有测试与匿名链路的向后兼容锚点）。
  // 非法组合（职业不存在/技能不属于该职业）= 建连被拒（fail-closed）。
  string class = 3;
  string skill = 4;
  // ===== 对局配置（05 号票；页面 URL 参数 ?topic=&cap=&strategy= 经 join 注入）=====
  // 仅首个 join（创建引擎时）被采纳并整场锁定；后续 join 携带的配置参数被
  // 忽略并记服务端日志（热座第二窗口复制粘贴同一链接，参数天然一致）。
  // 非法值回退默认并 WARN（配置不是安全边界，不拒连——与职业组合 fail-closed
  // 不同：错配置只影响体验，错身份会污染战绩）。
  // 空值 = 默认：题型全部 / cap L3 / climb（匿名缺省链路零行为变化）。
  // 题型只过滤共享攻击题，行动题跨题型（spec「出题系统」）。
  string topic = 5;    // 题型 key；非法/空 = 全部 6 题型
  string cap = 6;      // "L1".."L5"；非法/空 = L3（伤害与 ELO 系数的默认锚点）
  string strategy = 7; // uniform | climb；非法/空 = climb
  // ===== 09 号票：对局模式 =====
  // mode：空/pvp = 现行 PvP（零行为变化）；pve = 单人练习（人类固定 p1，
  // 服务端 Bot 占 p2）。与 topic/cap/strategy 一样由首个 join 锁定；
  // 非法值回退 PvP 并 WARN（配置不是安全边界）。
  string mode = 8;
  // bot：PvE 难度 easy | normal | hard；空 = normal，非法值回退 normal 并 WARN。
  string bot = 9;
}

message SubmitRequest {
  string code = 1;
  // 行动类型：attack | move | defend | skill（06 号票起扩展）
  string action = 2;
  // 移动目标格（仅 action=move 携带；直线正交距离 1-2，终点空格且路径不穿过对方）
  Position move_to = 3;
  // 攻击/技能的目标选择（06 号票；解出后至结算前可经 SetTargeting 随时修改，
  // 未提交则服务端自动瞄准：方向取指向对手的坐标轴，点狙距离取 min(射程, 与对手距离)）
  Targeting targeting = 4;
}

// 目标选择载荷（06 号票，设计 003 §1 方向选择全局规则）：
//   direction: up|down|left|right（攻击者朝向）；distance: 点狙类在方向上的格距。
// 哪些形状需要 direction/distance 由职业表（/api/classes）定义：
//   剑士普攻=direction；法师普攻=direction（深度2线扫）；游侠普攻=direction+distance(1-3)；
//   巨力斩=无方向（邻域8格）；烈焰风暴=direction；穿云箭=direction+distance(1-4)；
//   秘法汲取=direction+distance(≤2)；治疗系=无目标（自身）。
message Targeting {
  string direction = 1; // up | down | left | right；空 = 未指定（走自动瞄准）
  int32 distance = 2;   // 0 = 未指定（走自动瞄准）
}
