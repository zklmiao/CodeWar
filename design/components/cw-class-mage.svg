<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="法师占位剪影：长袍与法杖">
  <!-- 法师：长袍 + 法杖顶球（霓虹质感：辉光晕 + 垂直渐变 + 秘法环细节；
       颜色经 currentColor 由宿主的 mage 修饰类注入，结构约定见 004 §5） -->
  <defs>
    <g id="cwMageBody">
      <path d="M26 3 Q35 5 34 17 Q26 21 18 17 Q17 5 26 3 Z"/>
      <path d="M18 18 L12 54 Q26 62 40 54 L34 18 Q26 14 18 18 Z"/>
      <rect x="49" y="12" width="3" height="46" rx="1.5"/>
      <circle cx="50.5" cy="8" r="8" opacity="0.25"/>
      <circle cx="50.5" cy="8" r="5"/>
    </g>
    <linearGradient id="cwMageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity="1"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="cwMageGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <!-- 辉光晕：同形体模糊层 -->
  <use href="#cwMageBody" fill="currentColor" opacity="0.55" filter="url(#cwMageGlow)"/>
  <!-- 主体：垂直渐变（顶亮底暗） -->
  <use href="#cwMageBody" fill="url(#cwMageGrad)"/>
  <!-- 轮廓描边 -->
  <use href="#cwMageBody" fill="none" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
  <!-- 腰绳（半透明覆盖层） -->
  <rect x="17" y="32" width="18" height="3" fill="currentColor" opacity="0.35"/>
  <!-- 秘法环细节（杖顶球的魔力涟漪） -->
  <g stroke="currentColor" fill="none" opacity="0.4">
    <circle cx="50.5" cy="8" r="11" stroke-width="1"/>
    <circle cx="50.5" cy="8" r="14" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
